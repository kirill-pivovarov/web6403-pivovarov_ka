<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaintRent — Аренда и покупка картин</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/card.css">
    <link rel="stylesheet" href="../css/header.css">
</head>
<body>
    <header class="header">
        <!-- Используем div вместо несуществующего тега wrapper -->
        <div class="container wrapper">
            
            <!-- Логотип слева -->
            <div class="logo">
                <a href="index.html">PaintRent</a>
            </div>
            
            <!-- Навигация / Поиск строго по центру -->
            <nav class="nav">
                <form action="GET" class="search-form">
                    <input type="text" class="search-form-input search-form-item" placeholder="Поиск по названию или автору">
                    <select name="" id="" class="style-selecter search-form-item">
                        <option value="Авангард">Авангард</option>
                        <option value="Классика">Классика</option>
                    </select>
                    <select name="" id="" class="type-selecter search-form-item">
                        <option value="Аренда">Аренда</option>
                        <option value="Покупка">Покупка</option>
                        <option value="Аренда/Покупка">Аренда/Покупка</option>
                    </select>
                    <button class="submit-btn" type="submit">
                        <img src="../source/magnifier-svgrepo-com.svg" width="20" height="20" alt="Искать">
                    </button>
                </form>
            </nav>
            
            <!-- Блок с иконками справа -->
            <div class="header-right-actions">
                <div class="cart">
                    <a href="cart.html" class="cart-link">
                        <img src="../source/cart-shopping-svgrepo-com.svg" width="20" height="20" alt="Корзина">
                    </a>
                </div>
                <div class="profile">
                    <a href="profile.html" class="profile-link">
                        <img src="../source/profile-svgrepo-com.svg" width="20" height="20" alt="Профиль">
                    </a>
                </div>
            </div>

        </div>
    </header>
</body>
</html>
